<VirtualHost *:80>
    ServerName migiromotors.com.au
    ServerAlias www.migiromotors.com.au

    DocumentRoot /var/www/migiromotors
    DirectoryIndex index.html

    <Directory /var/www/migiromotors>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/migiromotors-error.log
    CustomLog ${APACHE_LOG_DIR}/migiromotors-access.log combined
</VirtualHost>
